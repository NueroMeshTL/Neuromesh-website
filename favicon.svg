<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#121a58"/>
  <!-- Central agent node -->
  <circle cx="16" cy="16" r="5" fill="none" stroke="#6c7dd9" stroke-width="1.8"/>
  <circle cx="16" cy="16" r="2.2" fill="#6c7dd9"/>
  <!-- 4 peripheral nodes -->
  <circle cx="7"  cy="9"  r="2" fill="none" stroke="#6c7dd9" stroke-width="1.2"/>
  <circle cx="25" cy="9"  r="2" fill="none" stroke="#6c7dd9" stroke-width="1.2"/>
  <circle cx="7"  cy="23" r="2" fill="none" stroke="#3a4faa" stroke-width="1.2"/>
  <circle cx="25" cy="23" r="2" fill="none" stroke="#3a4faa" stroke-width="1.2"/>
  <!-- Connecting lines (centre → nodes) -->
  <line x1="11.5" y1="12.7" x2="8.4"  y2="10.4" stroke="#6c7dd9" stroke-width="1" opacity="0.8"/>
  <line x1="20.5" y1="12.7" x2="23.6" y2="10.4" stroke="#6c7dd9" stroke-width="1" opacity="0.8"/>
  <line x1="11.5" y1="19.3" x2="8.4"  y2="21.6" stroke="#3a4faa" stroke-width="1" opacity="0.7"/>
  <line x1="20.5" y1="19.3" x2="23.6" y2="21.6" stroke="#3a4faa" stroke-width="1" opacity="0.7"/>
  <!-- Data-flow tick on top-right connector -->
  <circle cx="19.2" cy="11.5" r="1.1" fill="#6c7dd9" opacity="0.9"/>
</svg>
