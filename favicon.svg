<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background -->
  <rect width="32" height="32" rx="5" fill="#121a58"/>
  <!-- "NM" monogram-style neural net icon -->
  <!-- Three horizontal bus lines (data bus) -->
  <line x1="5" y1="10" x2="27" y2="10" stroke="#3a4faa" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="5" y1="16" x2="27" y2="16" stroke="#3a4faa" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <line x1="5" y1="22" x2="27" y2="22" stroke="#3a4faa" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <!-- 4 vertical node columns -->
  <!-- Column 1 (INPUT) -->
  <circle cx="8" cy="10" r="2.5" fill="#121a58" stroke="#6c7dd9" stroke-width="1.5"/>
  <circle cx="8" cy="16" r="2.5" fill="#6c7dd9"/>
  <circle cx="8" cy="22" r="2.5" fill="#121a58" stroke="#6c7dd9" stroke-width="1.5"/>
  <!-- Column 2 (AGENT - bigger, lit up) -->
  <circle cx="14" cy="10" r="2.5" fill="#121a58" stroke="#6c7dd9" stroke-width="1.5"/>
  <circle cx="14" cy="16" r="3.5" fill="#6c7dd9" opacity="0.9"/>
  <circle cx="14" cy="22" r="2.5" fill="#121a58" stroke="#6c7dd9" stroke-width="1.5"/>
  <!-- Column 3 -->
  <circle cx="20" cy="10" r="2.5" fill="#6c7dd9" opacity="0.7"/>
  <circle cx="20" cy="16" r="2.5" fill="#121a58" stroke="#6c7dd9" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="2.5" fill="#6c7dd9" opacity="0.7"/>
  <!-- Column 4 (OUTPUT) -->
  <circle cx="26" cy="10" r="2.5" fill="#121a58" stroke="#3a4faa" stroke-width="1.5"/>
  <circle cx="26" cy="16" r="2.5" fill="#121a58" stroke="#6c7dd9" stroke-width="1.5"/>
  <circle cx="26" cy="22" r="2.5" fill="#121a58" stroke="#3a4faa" stroke-width="1.5"/>
  <!-- Accent data packet dot -->
  <circle cx="17.5" cy="16" r="1.2" fill="#ffffff" opacity="0.9"/>
</svg>
