<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
	<link rel="icon" href="/favicon.ico" sizes="any"/>
	<meta name="viewport" content="width=device-width,initial-scale=1"/>
	<meta name="theme-color" content="#000000"/>
	<meta name="description" content="Web site created using create-react-app"/>
	<link rel="apple-touch-icon" href="/logo192.png"/>
	<link rel="manifest" href="/manifest.json"/>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<title>NeuroMesh</title>
	<script defer="defer" src="/static/js/main.c9f7a089.js"></script>
	<link href="/static/css/main.257aa9ea.css" rel="stylesheet">
	<style>
		/* ── Mobile menu overlay ── */
		.menu-overlay {
			position: fixed;
			inset: 0;
			background: rgba(3, 7, 28, 0.55);
			backdrop-filter: blur(3px);
			-webkit-backdrop-filter: blur(3px);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s ease;
			z-index: 998;
		}
		.menu-overlay.active { opacity: 1; pointer-events: auto; }
		body.menu-open { overflow: hidden; }

		@media (max-width: 900px) {
			.nav-links {
				right: -110% !important;
				opacity: 0;
				transition: right 0.38s cubic-bezier(0.22, 1, 0.36, 1),
				            opacity 0.25s ease !important;
				z-index: 1002;
			}
			.nav-links.open {
				right: 0 !important;
				opacity: 1;
			}
			.nav-links a {
				color: #c7d0ff !important;
				font-size: 1.05rem;
			}
			.nav-links a:hover { color: #ffffff !important; }
			.nav-links a.btn-primary {
				color: #121a58 !important;
			}
			.hamburger .bar {
				transition: transform 0.32s ease, opacity 0.22s ease,
				            background-color 0.22s ease !important;
			}
		}

		/* ── Agentic workflow banner strip (below hero) ── */
		#nm-banner {
			width: 100%;
			height: 50vh;
			min-height: 220px;
			max-height: 380px;
			background: #060b28;
			position: relative;
			overflow: hidden;
			opacity: 0;
			animation: nm-fadein 1.4s ease 0.3s forwards;
		}
		#nm-banner svg {
			width: 100%;
			height: 100%;
		}
		@keyframes nm-fadein { to { opacity: 1; } }
	</style>
</head>
<body>
	<noscript>You need to enable JavaScript to run this app.</noscript>
	<div id="root"></div>

	<script>
		(function () {

			/* ── 1. Mobile menu overlay ── */
			var overlay = document.createElement("div");
			overlay.className = "menu-overlay";
			document.body.appendChild(overlay);

			function setupHeader() {
				var navLinks = document.querySelector(".nav-links");
				if (!navLinks) return false;

				/* Add Careers link as plain <a> so it inherits .nav-links a style only */
				if (!navLinks.querySelector('[href$="careers.html"]')) {
					var c = document.createElement("a");
					c.href = "/careers.html";
					c.textContent = "Careers";
					var btn = navLinks.querySelector(".btn-primary");
					if (btn) navLinks.insertBefore(c, btn);
					else navLinks.appendChild(c);
				}

				var hamburger = document.querySelector(".hamburger");
				function syncOverlay() {
					var open = navLinks.classList.contains("open");
					overlay.classList.toggle("active", open);
					document.body.classList.toggle("menu-open", open);
				}
				syncOverlay();
				new MutationObserver(syncOverlay)
					.observe(navLinks, { attributes: true, attributeFilter: ["class"] });

				function closeMenu() {
					navLinks.classList.remove("open");
					if (hamburger) hamburger.classList.remove("open");
					syncOverlay();
				}
				overlay.addEventListener("click", closeMenu);
				document.addEventListener("keydown", function (e) {
					if (e.key === "Escape") closeMenu();
				});
				navLinks.querySelectorAll("a").forEach(function (a) {
					a.addEventListener("click", closeMenu);
				});
				return true;
			}

			var headerDone = false;
			var workflowDone = false;

			/* ── 2. Robotic agentic workflow banner BELOW hero ── */
			function buildWorkflowSVG() {
				var NS = "http://www.w3.org/2000/svg";
				function el(tag, attrs) {
					var e = document.createElementNS(NS, tag);
					Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
					return e;
				}
				function txt(parent, x, y, content, fill, size, weight) {
					var t = el("text", { x: x, y: y, "text-anchor": "middle", fill: fill,
						"font-family": "Inter,sans-serif", "font-size": size,
						"font-weight": weight || "400" });
					t.textContent = content;
					parent.appendChild(t);
				}
				function pulse(parent, cx, cy, r, dur, begin) {
					var c = el("circle", { cx: cx, cy: cy, r: r, fill: "none",
						stroke: "#6c7dd9", "stroke-width": "1", opacity: "0.4" });
					var ar = el("animate", { attributeName: "r", values: r + ";" + (r + 14) + ";" + r,
						dur: dur, begin: begin || "0s", repeatCount: "indefinite", calcMode: "ease" });
					var ao = el("animate", { attributeName: "opacity", values: "0.4;0.05;0.4",
						dur: dur, begin: begin || "0s", repeatCount: "indefinite", calcMode: "ease" });
					c.appendChild(ar); c.appendChild(ao); parent.appendChild(c);
				}
				function packet(parent, path, dur, begin, r, op) {
					var c = el("circle", { r: r || "4", fill: "#6c7dd9", opacity: op || "0.85", filter: "url(#nm-glow)" });
					var am = el("animateMotion", { dur: dur, begin: begin || "0s",
						repeatCount: "indefinite", calcMode: "linear", path: path });
					c.appendChild(am); parent.appendChild(c);
				}

				var svg = el("svg", {
					viewBox: "0 0 1200 380",
					preserveAspectRatio: "xMidYMid meet",
					"aria-hidden": "true",
					xmlns: NS
				});

				/* ── Defs: glow filter + dot-grid pattern ── */
				var defs = el("defs", {});
				var flt = el("filter", { id:"nm-glow", x:"-50%", y:"-50%", width:"200%", height:"200%" });
				var blur = el("feGaussianBlur", { in:"SourceGraphic", stdDeviation:"3.5", result:"b" });
				var merge = el("feMerge", {});
				merge.appendChild(el("feMergeNode", { in:"b" }));
				merge.appendChild(el("feMergeNode", { in:"SourceGraphic" }));
				flt.appendChild(blur); flt.appendChild(merge); defs.appendChild(flt);
				var pat = el("pattern", { id:"nm-grid", x:"0", y:"0", width:"40", height:"40",
					patternUnits:"userSpaceOnUse" });
				pat.appendChild(el("circle", { cx:"1", cy:"1", r:"1", fill:"#1e2a6a" }));
				defs.appendChild(pat);
				svg.appendChild(defs);

				/* ── Background: dot grid + scanlines ── */

				/* grid fill */
				svg.appendChild(el("rect", { x:"0", y:"0", width:"1200", height:"380",
					fill:"url(#nm-grid)" }));

				/* scanlines */
				for (var sl = 0; sl < 380; sl += 8) {
					svg.appendChild(el("line", { x1:"0", y1:sl, x2:"1200", y2:sl,
						stroke:"#0a1040", "stroke-width":"1", opacity:"0.35" }));
				}

				/* horizontal baseline bus */
				svg.appendChild(el("line", { x1:"60", y1:"190", x2:"1140", y2:"190",
					stroke:"#1e2d80", "stroke-width":"1", "stroke-dasharray":"4,4", opacity:"0.5" }));

				/* ── Node factory: sharp-hex look ── */
				var nodes = [
					{ cx:100,  label:"INPUT",   sub:"context",   sub2:"query" },
					{ cx:310,  label:"AGENT",   sub:"reason",    sub2:"plan" },
					{ cx:520,  label:"RETRIEVE",sub:"vector",    sub2:"search" },
					{ cx:730,  label:"EXECUTE", sub:"tool call", sub2:"API / code" },
					{ cx:940,  label:"MEMORY",  sub:"state",     sub2:"feedback" },
					{ cx:1100, label:"OUTPUT",  sub:"action",    sub2:"response" }
				];

				/* connector paths between node centres (Y=190) */
				var connPaths = [
					"M148,190 L240,190",
					"M358,190 L448,190",
					"M568,190 L658,190",
					"M778,190 L868,190",
					"M988,190 L1036,190"
				];

				/* draw connectors */
				connPaths.forEach(function (d) {
					svg.appendChild(el("path", { d:d, stroke:"#3a4faa", "stroke-width":"2",
						"stroke-dasharray":"6,4", fill:"none" }));
					/* arrowhead */
					var parts = d.replace("M","").split(" L");
					var ex = parseFloat(parts[1].split(",")[0]);
					var ey = parseFloat(parts[1].split(",")[1]);
					svg.appendChild(el("polygon", {
						points: (ex)+","+(ey-5)+" "+(ex+10)+","+ey+" "+ex+","+(ey+5),
						fill:"#3a4faa", opacity:"0.8"
					}));
				});

				/* data packets */
				connPaths.forEach(function (d, i) {
					packet(svg, d, "1.6s", "-" + (i * 0.32) + "s", "3.5", "1");
				});

				/* feedback arc: OUTPUT → AGENT (loop-back) */
				var fbPath = "M1100,212 C1100,310 310,310 310,212";
				svg.appendChild(el("path", { d:fbPath, stroke:"#6c7dd9", "stroke-width":"1.5",
					"stroke-dasharray":"5,6", fill:"none", opacity:"0.4" }));
				packet(svg, fbPath, "3.8s", "-1.5s", "3", "0.7");
				packet(svg, fbPath, "3.8s", "-3.1s", "3", "0.7");

				/* draw nodes */
				nodes.forEach(function (n, i) {
					var W = 96, H = 52, cx = n.cx, cy = 190;
					var g = el("g", {});

					/* outer sharp rect with clipped corners (clip-path polygon) */
					var clip = 6;
					var x0=cx-W/2, y0=cy-H/2, x1=cx+W/2, y1=cy+H/2;
					var pts = (x0+clip)+","+y0+" "+x1+","+y0+" "+x1+","+(y1-clip)+" "+(x1-clip)+","+y1+" "+x0+","+y1+" "+x0+","+(y0+clip);
					/* bg */
					g.appendChild(el("polygon", { points:pts, fill:"#080e30",
						stroke:"#3a4faa", "stroke-width":"1.5" }));
					/* accent top bar */
					var barPts = (x0+clip)+","+y0+" "+x1+","+y0+" "+x1+","+(y0+5)+" "+x0+","+(y0+5);
					g.appendChild(el("polygon", { points:barPts, fill:"#3a4faa", opacity:"0.9" }));

					/* corner tick marks */
					[[x0,y0+clip,x0+clip,y0],[x1,y0+clip,x1-clip,y0]].forEach(function(c){
						g.appendChild(el("line", { x1:c[0], y1:c[1], x2:c[2], y2:c[3],
							stroke:"#6c7dd9", "stroke-width":"1", opacity:"0.7" }));
					});

					/* label */
					txt(g, cx, cy-2, n.label, "#a8b8ff", "10", "700");
					txt(g, cx, cy+11, n.sub,   "#4a5a9a", "8");
					txt(g, cx, cy+21, n.sub2,  "#3a4a8a", "7.5");

					/* blink indicator (active node) */
					var ind = el("circle", { cx:x0+10, cy:y0+12, r:"3", fill:"#6c7dd9" });
					ind.appendChild(el("animate", { attributeName:"opacity",
						values:"1;0.1;1", dur: (1.2 + i*0.3) + "s",
						begin: "-" + (i*0.2) + "s",
						repeatCount:"indefinite" }));
					g.appendChild(ind);

					svg.appendChild(g);
				});

				/* label strip at bottom */
				txt(svg, 600, 360, "NEUROMESH  ·  AGENTIC AI PIPELINE", "#1e2d80", "10", "600");

				return svg;
			}

			function injectWorkflow() {
				if (document.getElementById("nm-banner")) return true;
				var hero = document.querySelector(".hero");
				if (!hero) return false;
				var banner = document.createElement("div");
				banner.id = "nm-banner";
				banner.appendChild(buildWorkflowSVG());
				hero.insertAdjacentElement("afterend", banner);
				return true;
			}

			/* ── Observer: wait for React to render both ── */
			var obs = new MutationObserver(function () {
				if (!headerDone) headerDone = setupHeader();
				if (!workflowDone) workflowDone = injectWorkflow();
				if (headerDone && workflowDone) obs.disconnect();
			});
			obs.observe(document.body, { childList: true, subtree: true });
			headerDone = setupHeader();
			workflowDone = injectWorkflow();
		})();
	</script>
</body>
</html>
