<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<link rel="icon" href="/favicon.ico"/>
	<meta name="viewport" content="width=device-width,initial-scale=1"/>
	<meta name="theme-color" content="#000000"/>
	<meta name="description" content="Web site created using create-react-app"/>
	<link rel="apple-touch-icon" href="/logo192.png"/>
	<link rel="manifest" href="/manifest.json"/>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<title>NeuroMesh</title>
	<script defer="defer" src="/static/js/main.c9f7a089.js"></script>
	<link href="/static/css/main.257aa9ea.css" rel="stylesheet">
	<style>
		.menu-overlay {
			position: fixed;
			inset: 0;
			background: rgba(3, 7, 28, 0.5);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.28s ease;
			z-index: 998;
		}

		.menu-overlay.active {
			opacity: 1;
			pointer-events: auto;
		}

		body.menu-open {
			overflow: hidden;
		}

		@media (max-width: 768px) {
			.nav-links {
				right: -110%;
				opacity: 0;
				transform: translateX(28px);
				transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease, transform 0.3s ease;
				z-index: 1002;
			}

			.nav-links.open {
				right: 0;
				opacity: 1;
				transform: translateX(0);
				background: rgba(10, 15, 61, 0.97);
			}

			.nav-links a {
				color: #edf2ff !important;
				font-size: 1.03rem;
				letter-spacing: 0.2px;
			}

			.nav-links a:hover {
				color: #9fb0ff !important;
			}

			.hamburger .bar {
				transition: transform 0.32s ease, opacity 0.22s ease, background-color 0.22s ease;
			}
		}
	</style>
</head>
<body>
	<noscript>You need to enable JavaScript to run this app.</noscript>
	<div id="root"></div>

	<script>
		(function () {
			var overlay = document.createElement("div");
			overlay.className = "menu-overlay";
			document.body.appendChild(overlay);

			function setupHeader() {
				var navLinks = document.querySelector(".nav-links");
				if (!navLinks) {
					return false;
				}

				if (!navLinks.querySelector('a[href="/careers.html"], a[href="./careers.html"], a[href="careers.html"]')) {
					var ref = navLinks.querySelector("a:last-of-type") || navLinks.querySelector("a");
					if (ref) {
						var careersLink = ref.cloneNode(true);
						careersLink.href = "./careers.html";
						careersLink.textContent = "Careers";
						careersLink.setAttribute("aria-label", "Careers");
						navLinks.appendChild(careersLink);
					}
				}

				var hamburger = document.querySelector(".hamburger");
				function syncMenuState() {
					var isOpen = navLinks.classList.contains("open");
					overlay.classList.toggle("active", isOpen);
					document.body.classList.toggle("menu-open", isOpen);
				}

				syncMenuState();

				var classObserver = new MutationObserver(syncMenuState);
				classObserver.observe(navLinks, { attributes: true, attributeFilter: ["class"] });

				overlay.addEventListener("click", function () {
					navLinks.classList.remove("open");
					if (hamburger) {
						hamburger.classList.remove("open");
					}
					syncMenuState();
				});

				document.addEventListener("keydown", function (event) {
					if (event.key === "Escape") {
						navLinks.classList.remove("open");
						if (hamburger) {
							hamburger.classList.remove("open");
						}
						syncMenuState();
					}
				});

				var links = navLinks.querySelectorAll("a");
				links.forEach(function (link) {
					link.addEventListener("click", function () {
						navLinks.classList.remove("open");
						if (hamburger) {
							hamburger.classList.remove("open");
						}
						syncMenuState();
					});
				});

				return true;
			}

			if (!setupHeader()) {
				var attempts = 0;
				var observer = new MutationObserver(function () {
					attempts += 1;
					if (setupHeader() || attempts > 60) {
						observer.disconnect();
					}
				});
				observer.observe(document.body, { childList: true, subtree: true });
			}
		})();
	</script>
</body>
</html>
